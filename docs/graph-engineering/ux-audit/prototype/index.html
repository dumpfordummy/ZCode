<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graph Tasks Prototype</title>
    <meta
      name="description"
      content="Isolated clickable prototype of the proposed Graph Engineering task flow. Synthetic data only."
    />
    <style>
      /* Tokens mirror packages/ui/src/styles.css (.theme-zai-dark / .theme-zai-light). No new colours are introduced. */
      :root {
        --ui-font-size: 14px;
        --text-xl: calc(var(--ui-font-size) + 4px);
        --text-lg: calc(var(--ui-font-size) + 2px);
        --text-base: var(--ui-font-size);
        --text-caption: calc(var(--ui-font-size) - 1px);
        --text-sm: calc(var(--ui-font-size) - 2px);
        --text-xs: calc(var(--ui-font-size) - 4px);
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei UI",
          "Noto Sans CJK SC", sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Microsoft YaHei UI", "PingFang SC", monospace;
        --background: #161616;
        --sidebar: #161616;
        --panel: #202020;
        --card: #2b2b2b;
        --input: #2b2b2b;
        --menu-hover: #363636;
        --secondary: #363636;
        --tag: #363636;
        --border: rgba(255, 255, 255, 0.1);
        --border-hover: rgba(255, 255, 255, 0.15);
        --hover: rgba(255, 255, 255, 0.05);
        --selected: rgba(255, 255, 255, 0.1);
        --surface: rgba(255, 255, 255, 0.05);
        --fg: #d4d4d4;
        --fg-subtle: color-mix(in oklab, #d4d4d4 60%, transparent);
        --fg-inverse: #000;
        --primary: #fff;
        --primary-fg: #000;
        --success: #46bf72;
        --warning: #ff8a30;
        --destructive: #ff5c5c;
        --confirm-surface: rgba(70, 191, 114, 0.16);
        --confirm-fg: #87d9a4;
        --focus: #fff;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --background: #f8f8f8;
        --sidebar: #f0f0f0;
        --panel: #fff;
        --card: #fff;
        --input: #fff;
        --menu-hover: #f0f0f0;
        --secondary: #e6e6e6;
        --tag: #e6e6e6;
        --border: rgba(13, 13, 13, 0.1);
        --border-hover: rgba(13, 13, 13, 0.15);
        --hover: rgba(13, 13, 13, 0.05);
        --selected: rgba(13, 13, 13, 0.07);
        --surface: rgba(13, 13, 13, 0.03);
        --fg: #262626;
        --fg-subtle: color-mix(in oklab, #262626 62%, transparent);
        --fg-inverse: #fff;
        --primary: #000;
        --primary-fg: #fff;
        --success: #1e8a3e;
        --warning: #e07b00;
        --destructive: #e03131;
        --confirm-surface: #eaf7ee;
        --confirm-fg: #166b32;
        --focus: #000;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--background);
        color: var(--fg);
        font: 400 var(--text-base)/1.45 var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      h2 {
        font-size: var(--text-lg);
        font-weight: 600;
      }
      h3 {
        font-size: var(--text-base);
        font-weight: 600;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .muted {
        color: var(--fg-subtle);
      }
      .mono {
        font-family: var(--font-mono);
      }
      .sm {
        font-size: var(--text-sm);
      }
      .caption {
        font-size: var(--text-caption);
      }
      svg.i {
        width: 14px;
        height: 14px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      svg.i.lg {
        width: 16px;
        height: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
        * {
          transition: none !important;
        }
      }

      /* Focus: the product resets outline/box-shadow globally (styles.css:124), so focus is drawn with border + fill only. */
      :focus {
        outline: none;
      }
      :focus-visible {
        border-color: var(--focus) !important;
        background-color: var(--selected) !important;
      }
      textarea:focus-visible,
      input:focus-visible,
      select:focus-visible {
        border-color: var(--focus) !important;
      }

      /* Frame */
      .frame {
        display: grid;
        grid-template-columns: 248px 1fr;
        height: 100dvh;
      }
      .app-sidebar {
        background: var(--sidebar);
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-right: 1px solid var(--border);
        overflow: hidden;
      }
      .app-sidebar .brand {
        font-weight: 700;
        padding: 4px 8px 12px;
      }
      .side-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 8px;
        color: var(--fg);
        background: none;
        border: 1px solid transparent;
        text-align: left;
      }
      .side-item[aria-current="page"] {
        background: var(--selected);
      }
      .side-label {
        padding: 14px 8px 4px;
        color: var(--fg-subtle);
        font-size: var(--text-sm);
      }
      .side-note {
        margin-top: auto;
        padding: 8px;
        color: var(--fg-subtle);
        font-size: var(--text-sm);
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--panel);
        margin: 4px;
        border-radius: 12px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .proto-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 4px 12px;
        background: var(--surface);
        border-bottom: 1px dashed var(--border-hover);
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }
      .proto-banner strong {
        color: var(--fg);
        font-weight: 600;
      }
      .proto-banner .spacer {
        flex: 1;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: var(--hover);
        border-color: var(--border-hover);
      }
      .btn.primary {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: transparent;
      }
      .btn.primary:hover:not(:disabled) {
        background: color-mix(in oklab, var(--primary) 85%, transparent);
      }
      .btn.ghost {
        border-color: transparent;
      }
      .btn.danger {
        border-color: color-mix(in oklab, var(--destructive) 45%, transparent);
      }
      .btn.lg {
        min-height: 32px;
        padding: 0 14px;
      }
      .btn.sm {
        min-height: 28px;
        font-size: var(--text-sm);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.w-full {
        width: 100%;
      }
      .btn.primary:focus-visible {
        background-color: var(--primary) !important;
        box-shadow: none;
        border-color: var(--fg-inverse) !important;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* Graph header / nav */
      .g-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px 0;
        flex-wrap: wrap;
      }
      .g-header h1 {
        font-size: var(--text-base);
        font-weight: 600;
        margin-right: 4px;
      }
      .ctx {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 6px 12px 8px;
        font-size: var(--text-sm);
      }
      .ctx-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        max-width: 100%;
      }
      .ctx-chip .k {
        color: var(--fg-subtle);
      }
      .ctx-chip.btn-like:hover {
        background: var(--hover);
        border-color: var(--border-hover);
      }
      .g-nav {
        display: flex;
        gap: 2px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
      }
      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        border-radius: 6px 6px 0 0;
        color: var(--fg-subtle);
      }
      .nav-btn:hover {
        color: var(--fg);
        background: var(--hover);
      }
      .nav-btn[aria-current="page"] {
        color: var(--fg);
        border-bottom-color: var(--fg);
        font-weight: 600;
      }
      .nav-btn .count {
        font-size: var(--text-sm);
        background: var(--tag);
        border-radius: 999px;
        min-width: 18px;
        text-align: center;
        padding: 0 5px;
      }

      /* Needs you strip */
      .needs {
        display: none;
      }
      .needs.on {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: color-mix(in oklab, var(--warning) 12%, transparent);
        border-bottom: 1px solid color-mix(in oklab, var(--warning) 35%, transparent);
        flex-wrap: wrap;
      }
      .needs .ico {
        color: var(--warning);
        display: inline-flex;
      }
      .needs .txt {
        flex: 1;
        min-width: 200px;
      }
      .needs .txt b {
        font-weight: 600;
      }

      /* Layout */
      main {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .tasks {
        display: grid;
        grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .activity {
        border-right: 1px solid var(--border);
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
      }
      .group-title {
        font-size: var(--text-sm);
        color: var(--fg-subtle);
        font-weight: 600;
        padding: 0 4px 4px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: none;
      }
      .row:hover {
        background: var(--hover);
      }
      .row[aria-current="true"] {
        background: var(--selected);
      }
      .row .ri {
        margin-top: 2px;
      }
      .row-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 2px;
      }
      .row-title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .row-sub {
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }
      .detail {
        overflow-y: auto;
        min-width: 0;
        min-height: 0;
        padding: 16px 20px 0;
        position: relative;
      }
      .detail-inner {
        max-width: 820px;
        padding-bottom: 24px;
      }
      .detail h2:focus {
        outline: none;
      }
      .sec {
        padding: 12px 0;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sec:first-of-type {
        border-top: 0;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .field-label {
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }
      textarea,
      input[type="text"],
      input[type="search"],
      select {
        width: 100%;
        background: var(--input);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        min-height: 28px;
      }
      textarea {
        resize: vertical;
        min-height: 64px;
        line-height: 1.5;
      }
      textarea:hover,
      input:hover,
      select:hover {
        border-color: var(--border-hover);
      }
      ::placeholder {
        color: var(--fg-subtle);
        opacity: 1;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        background: var(--tag);
        border: 1px solid transparent;
        font-size: var(--text-sm);
      }
      .chip.btn-like {
        cursor: pointer;
      }
      .x {
        background: none;
        border: 1px solid transparent;
        padding: 2px;
        display: inline-flex;
        border-radius: 4px;
        color: inherit;
      }
      .x:hover {
        background: var(--hover);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: var(--text-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        white-space: nowrap;
      }
      .pill.warn {
        background: color-mix(in oklab, var(--warning) 14%, transparent);
        border-color: color-mix(in oklab, var(--warning) 40%, transparent);
      }
      .pill.warn svg {
        color: var(--warning);
      }
      .pill.ok svg {
        color: var(--success);
      }
      .pill.bad {
        background: color-mix(in oklab, var(--destructive) 12%, transparent);
        border-color: color-mix(in oklab, var(--destructive) 40%, transparent);
      }
      .pill.bad svg {
        color: var(--destructive);
      }
      .pill.run svg {
        color: var(--fg);
      }
      .ic-ok {
        color: var(--success);
      }
      .ic-bad {
        color: var(--destructive);
      }
      .ic-warn {
        color: var(--warning);
      }
      .kv {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        gap: 6px 14px;
        margin: 0;
      }
      .kv dt {
        color: var(--fg-subtle);
        font-size: var(--text-sm);
        padding-top: 1px;
      }
      .kv dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .code {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        display: block;
        overflow-x: auto;
        white-space: pre;
      }
      .checkrow {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        gap: 8px 12px;
        align-items: center;
      }
      .checkrow .lbl {
        color: var(--fg-subtle);
        font-size: var(--text-sm);
      }
      .picker {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--menu, var(--card));
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 5px 8px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: none;
      }
      .opt:hover {
        background: var(--menu-hover);
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .footer-bar {
        position: sticky;
        bottom: 0;
        margin: 0 -20px;
        padding: 10px 20px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        z-index: 2;
      }
      .footer-bar .grow {
        flex: 1;
        min-width: 240px;
      }
      .check-label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .check-label input {
        margin-top: 3px;
        width: 16px;
        height: 16px;
        accent-color: var(--fg);
      }

      /* Stepper */
      .stepper {
        display: flex;
        gap: 0;
        list-style: none;
        padding: 0;
        margin: 0;
        flex-wrap: wrap;
      }
      .stepper li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 0;
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }
      .stepper li .sep {
        color: var(--fg-subtle);
      }
      .stepper li:last-child .sep {
        display: none;
      }
      .stepper li.now {
        color: var(--fg);
        font-weight: 600;
      }
      .stepper li.done {
        color: var(--fg);
      }
      .stepper li.bad {
        color: var(--fg);
        font-weight: 600;
      }
      .verdicts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .verdict {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .verdict .k {
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }
      .verdict .v {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 600;
      }
      .verdict .sub {
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }
      .alert {
        border: 1px solid var(--border-hover);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--surface);
      }
      .alert.warn {
        border-color: color-mix(in oklab, var(--warning) 45%, transparent);
        background: color-mix(in oklab, var(--warning) 9%, transparent);
      }
      .alert.bad {
        border-color: color-mix(in oklab, var(--destructive) 45%, transparent);
        background: color-mix(in oklab, var(--destructive) 8%, transparent);
      }
      .alert .head {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .alert .head h3 {
        font-size: var(--text-base);
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        min-height: 30px;
        padding: 0 12px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--fg-subtle);
        border-radius: 6px 6px 0 0;
      }
      .tab[aria-selected="true"] {
        color: var(--fg);
        border-bottom-color: var(--fg);
        font-weight: 600;
      }
      .tab:hover {
        color: var(--fg);
        background: var(--hover);
      }
      .tabpanel {
        padding-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .timeline {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .timeline li {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 8px 4px;
        border-top: 1px solid var(--border);
        align-items: start;
      }
      .timeline li:first-child {
        border-top: 0;
      }
      .diff {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .diff div {
        padding: 2px 10px;
        white-space: pre;
      }
      .diff .add {
        background: color-mix(in oklab, var(--success) 16%, transparent);
      }
      .diff .del {
        background: color-mix(in oklab, var(--destructive) 14%, transparent);
      }
      .rawout {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--surface);
      }
      .rawout mark {
        background: color-mix(in oklab, var(--destructive) 28%, transparent);
        color: var(--fg);
        border-radius: 3px;
        padding: 0 2px;
      }
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--text-sm);
      }
      table.tbl th {
        text-align: left;
        color: var(--fg-subtle);
        font-weight: 500;
        padding: 4px 8px 4px 0;
      }
      table.tbl td {
        padding: 6px 8px 6px 0;
        border-top: 1px solid var(--border);
        vertical-align: top;
      }

      /* Native conversation mock */
      .conv {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .conv-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .conv-body {
        flex: 1;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        padding: 20px 16px;
      }
      .conv-col {
        width: min(640px, 100%);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bubble {
        background: var(--surface);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .perm {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .perm .opts {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .perm .o {
        display: flex;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: none;
        text-align: left;
      }
      .perm .o[aria-checked="true"] {
        background: var(--selected);
      }
      .simtag {
        font-size: var(--text-sm);
        color: var(--fg-subtle);
        border: 1px dashed var(--border-hover);
        border-radius: 6px;
        padding: 1px 6px;
      }
      .owner-note {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: var(--text-sm);
        color: var(--fg-subtle);
      }

      /* Checks view */
      .split {
        display: grid;
        grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .split > .l {
        border-right: 1px solid var(--border);
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .split > .r {
        padding: 16px 20px;
        overflow-y: auto;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
      }
      .form-grid .full {
        grid-column: 1 / -1;
      }
      .arglist {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .arglist li {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 8px;
        align-items: center;
      }
      .arglist .n {
        color: var(--fg-subtle);
        font-size: var(--text-sm);
        text-align: right;
      }

      /* Prototype panel */
      .proto-panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: min(340px, calc(100vw - 24px));
        background: var(--card);
        border: 1px solid var(--border-hover);
        border-radius: 12px;
        padding: 12px;
        z-index: 30;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        display: none;
        flex-direction: column;
        gap: 10px;
      }
      .proto-panel.on {
        display: flex;
      }
      .seg {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .seg button[aria-pressed="true"] {
        background: var(--selected);
        border-color: var(--border-hover);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: var(--card);
        border: 1px solid var(--border-hover);
        border-radius: 12px;
        padding: 8px 14px;
        z-index: 40;
        display: none;
        gap: 10px;
        align-items: center;
      }
      .toast.on {
        display: flex;
      }

      @media (max-width: 1000px) {
        .frame {
          grid-template-columns: 1fr;
        }
        .app-sidebar {
          display: none;
        }
        .tasks,
        .split {
          grid-template-columns: 1fr;
        }
        .tasks[data-mobile="detail"] .activity,
        .split[data-mobile="detail"] > .l {
          display: none;
        }
        .tasks[data-mobile="list"] .detail,
        .split[data-mobile="list"] > .r {
          display: none;
        }
        .verdicts {
          grid-template-columns: 1fr;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .kv {
          grid-template-columns: 1fr;
        }
        .back-list {
          display: inline-flex !important;
        }
      }
      .back-list {
        display: none;
      }
    </style>
  </head>

      function tabPanel(r) {
        const ids = stepsFor(r.wf);
        if (S.tab === "steps") {
          return `<ul class="timeline">${ids
            .map((id) => {
              const s = r.steps[id]?.state ?? "pending";
              const l = {
                pending: "tlPending",
                running: "tlRunning",
                done: "tlDone",
                failed: "tlFailed",
                waiting: "tlWaiting",
                skipped: "tlSkipped",
              }[s];
              const icn =
                s === "done"
                  ? ["check", "ic-ok"]
                  : s === "failed"
                    ? ["x", "ic-bad"]
                    : s === "running"
                      ? ["load", "", 1]
                      : s === "waiting"
                        ? ["shield", "ic-warn"]
                        : s === "skipped"
                          ? ["ban", ""]
                          : ["dash", ""];
              const rcv =
                id === "analyze"
                  ? `<div class="sm muted">${tt("rvTask")}:${esc(short(r.request, 50))}${r.context.length ? " · " + tt("context") + ": " + r.context.map((c) => esc(c.name)).join(", ") : ""}</div>`
                  : "";
              return `<li><span class="${icn[1]}">${ic(icn[0], icn[2] ? "spin" : "")}</span><div>${stepName(id)}${rcv}</div><span class="sm muted">${tt(l)}</span></li>`;
            })
            .join("")}</ul>`;
        }
        if (S.tab === "checks") {
          if (r.wf !== "seq") return `<p class="muted">${tt("noChecksAgent")}</p>`;
          const done = r.steps.build?.state === "done",
            tdone = r.steps.test?.state === "done",
            tfail = r.steps.test?.state === "failed";
          if (!done && !tdone && !tfail) return `<p class="muted">${tt("chNotRunTab")}</p>`;
          const dr = r.draft ?? { build: "build", test: "test" };
          const cs = r.checks ?? S.checksSaved;
          const b = cs.find((c) => c.id === dr.build),
            t = cs.find((c) => c.id === dr.test);
          return `<table class="tbl"><thead><tr><th>${tt("build")} / ${tt("test")}</th><th>${tt("cmd")}</th><th>${tt("exit")}</th><th>${tt("assertions")}</th></tr></thead><tbody>
      <tr><td>${esc(b.name)}</td><td class="mono">${esc(b.exe + " " + b.args[0])} …</td><td>${done ? "0" : "—"}</td><td>—</td></tr>
      <tr><td>${esc(t.name)}</td><td class="mono">${esc(t.exe + " " + t.args[0])} …</td><td>${tdone ? "0" : tfail ? "1" : "—"}</td><td>${tdone ? `1 ${tt("asPass")}` : tfail ? `1 ${tt("asFail")}` : "—"}</td></tr></tbody></table>
      ${tfail ? `<div class="alert bad"><strong>zz-demo contains after</strong><div class="diff"><div class="del">${tt("expected")}: after</div><div class="add">${tt("got")}: still-before</div></div></div>` : ""}`;
        }
        if (S.tab === "changes") {
          const edited =

            r.steps.implement?.state !== "skipped";
          return edited
            ? `<h3>${tt("changesTitle")}</h3><div class="code">zz-demo.txt</div><div class="diff"><div class="del">- before</div><div class="add">+ after</div></div><p class="sm muted">${tt("changesNote")}</p>`
            : `<p class="muted">${tt("changesNone")}</p>`;

          r.status === "stopped-review"
            ? `<h3>${tt("rawOut")}</h3><div class="rawout">${RAW_REVIEW}</div><p class="sm">${tt("rawWhy")}</p>`
            : "";
        return `${raw}<h3>${tt("evTitle")}</h3><p class="sm muted">${tt("evNote")}</p><dl class="kv"><dt>${tt("evRun")}</dt><dd class="mono sm">${r.id}-2535e508</dd><dt>${tt("evWorkflow")}</dt><dd class="mono sm">generic v2 · 7307e6439e16…</dd><dt>${tt("evVerif")}</dt><dd class="mono sm">aae5f8ed-506b-4dda-80ba-d633dcd38161 <span class="muted">(${tt("artifactRef")})</span></dd><dt>${tt("evConv")}</dt><dd>${ids.slice(0, 5).map(stepName).join(" · ")}</dd></dl>`;

      /* ============================ conversation mock ============================ */

      /* ============================ checks & workflows ============================ */

    ${S.checks.map((c) => `<button class="row" data-act="check-sel" data-id="${c.id}" ${c.id === S.checkSel ? 'aria-current="true"' : ""}><span class="ri">${ic("list")}</span><span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">${c.kind} · ${isDirty(c.id) ? tt("unsaved") : tt("savedNotRun")}</span></span></button>`).join("")}

      <div class="sec"><button class="btn sm" disabled>${ic("play")}${tt("tryCheck")}</button><p class="sm muted">${tt("tryNote")}</p></div>

      function workflowsView() {
        return `<div class="detail" style="flex:1"><div class="detail-inner"><h2 id="pane-h">${tt("wfTitle")}</h2><p class="muted" style="margin-top:6px;max-width:64ch">${tt("wfLead")}</p><p class="alert" style="margin-top:14px;max-width:64ch">${tt("wfNotProto")}</p></div></div>`;
      }

      /* ============================ events ============================ */
      function bindMain() {
        const req = $("#req");
        if (req) {
          req.addEventListener("input", () => {
            S.draft.request = req.value;
            const ok = req.value.trim();
            $("#go-review").disabled = !ok;
            $("#review-hint").textContent = ok ? tt("reviewHint") : tt("reviewHintEmpty");
          });
          req.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && S.draft.request.trim()) {
              e.preventDefault();
              goReview();
            }
          });
        }
        const wf = $("#wf");
        if (wf)
          wf.addEventListener("change", () => {
            S.draft.wf = wf.value;
            render();
            $("#wf")?.focus();
          });
        ["build", "test"].forEach((k) => {
          const e = $("#sel-" + k);
          if (e)
            e.addEventListener("change", () => {
              S.draft[k] = e.value;
              render();
            });
        });
        const pq = $("#pq");
        if (pq) {
          pq.focus();
          pq.setSelectionRange(pq.value.length, pq.value.length);
          pq.addEventListener("input", () => {
            S.pickerQ = pq.value;
            render();
          });
          pq.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              S.pickerOpen = false;
              S.pickerQ = "";
              render();
              $('[data-act="picker"]')?.focus();
            }
          });
        }
        const ack = $("#ack");
        if (ack)
          ack.addEventListener("change", () => {
            S.ack = ack.checked;
            $("#go-start").disabled = !S.ack;
            $("#ack-hint").hidden = S.ack;
          });
        const cmt = $("#cmt");
        if (cmt)
          cmt.addEventListener("input", () => {
            S.comment = cmt.value;
            const ok = cmt.value.trim() ? false : true;
            $("#btn-approve").disabled = ok;
            $("#btn-reject").disabled = ok;
          });
        $$("[data-field]").forEach((i) =>
          i.addEventListener("input", () => {
            const sel = S.checks.find((c) => c.id === S.checkSel);
            const k = i.dataset.field;
            if (k === "name") sel.name = i.value;
            else if (k === "exe") sel.exe = i.value;
            else if (k === "cwd") sel.cwd = i.value;
            else if (k === "timeout") sel.timeout = i.value;
            else if (k === "sources") sel.sources = i.value;
            else if (k === "report") sel.reportPath = i.value;
            else if (k === "min") sel.minTests = i.value;
            else if (k === "req") sel.required = i.value;
            else if (k === "out") sel.outputs = i.value;
            S.checkNote = false;
            $("[data-act='check-save']").disabled = !isDirty(S.checkSel);
            $("[data-act='check-revert']").disabled = !isDirty(S.checkSel);
            $("[role=status]", $(".footer-bar")).textContent = isDirty(S.checkSel)
              ? tt("unsaved")
              : "";
          }),
        );
        $$("[data-arg]").forEach((i) =>
          i.addEventListener("input", () => {
            const sel = S.checks.find((c) => c.id === S.checkSel);
            sel.args[+i.dataset.arg] = i.value;
            S.checkNote = false;
            $("[data-act='check-save']").disabled = !isDirty(S.checkSel);
            $("[data-act='check-revert']").disabled = !isDirty(S.checkSel);
          }),
        );
        const tabs = $$('[role="tab"]');
        tabs.forEach((t, i) =>
          t.addEventListener("keydown", (e) => {
            const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
            if (d) {
              e.preventDefault();
              const n = tabs[(i + d + tabs.length) % tabs.length];
              S.tab = n.dataset.t;
              render();
              $("#tab-" + S.tab).focus();
            } else if (e.key === "Home") {
              e.preventDefault();
              S.tab = tabs[0].dataset.t;
              render();
              $("#tab-" + S.tab).focus();
            } else if (e.key === "End") {
              e.preventDefault();
              S.tab = tabs.at(-1).dataset.t;
              render();
              $("#tab-" + S.tab).focus();
            }
          }),
        );
        const radios = $$('[role="radio"]');
        radios.forEach((o, i) =>
          o.addEventListener("keydown", (e) => {
            const d = { ArrowDown: 1, ArrowUp: -1, ArrowRight: 1, ArrowLeft: -1 }[e.key];
            if (d) {
              e.preventDefault();
              // 只有 Allow / Deny 可选；第三项在原型中未实现，保持 disabled。
              S.convChoice = (i + d + 2) % 2;
              render();
              $$('[role="radio"]')[S.convChoice].focus();
            } else if (e.key === "Enter") {
              e.preventDefault();
              act("conv-confirm");
            }
          }),
        );
        const rows = $$(".activity .row");
        rows.forEach((r, i) =>
          r.addEventListener("keydown", (e) => {
            const d = { ArrowDown: 1, ArrowUp: -1 }[e.key];
            if (d && rows[i + d]) {
              e.preventDefault();
              rows[i + d].focus();
            }
          }),
        );
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        act(b.dataset.act, b);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (S.cancelAsk) {
            S.cancelAsk = false;
            render();
          } else if (S.protoOpen) setProto(false);
        }
      });
      function act(a, el) {
        const id = el?.dataset?.id;
        switch (a) {
          case "nav":
            S.view = el.dataset.v;
            S.conv = null;
            S.mobile = "detail";
            render(true);
            break;
          case "new":
            S.view = "tasks";
            S.conv = null;
            S.pane = "compose";
            S.selected = null;
            S.mobile = "detail";
            render(true);
            $("#req")?.focus();
            break;
          case "open-run":
            S.view = "tasks";
            S.conv = null;
            S.pane = "run";
            S.selected = id;
            S.mobile = "detail";
            S.tab = defaultTab(runById(id));
            S.cancelAsk = false;
            S.comment = "";
            render(true);
            break;
          case "back-list":
            S.mobile = "list";
            render();
            break;
          case "copy-path":
            navigator.clipboard?.writeText(WORKSPACE_PATH).catch(() => {});
            toast(tt("copied"));
            break;
          case "recent": {
            const r = [...new Set(S.runs.map((x) => x.request))][+el.dataset.n];
            S.draft.request = r;
            S.prefilledFrom = null;
            render();
            $("#req").focus();
            break;
          }
          case "picker":
            S.pickerOpen = !S.pickerOpen;
            S.pickerQ = "";
            render();
            break;
          case "ctx-add": {
            const c = CATALOG.find((x) => x.id === id);
            S.draft.context.push({ id: c.id, name: c.name, kind: c.kind, path: c.path });
            S.pickerOpen = false;
            S.pickerQ = "";
            render();
            live(tt("context") + ": " + c.name);
            $('[data-act="picker"]')?.focus();
            break;
          }
          case "ctx-remove": {
            S.draft.context = S.draft.context.filter((c) => c.id !== id);
            render();
            $('[data-act="picker"]')?.focus();
            break;
          }
          case "review":
            goReview();
            break;
          case "back-edit":
            S.pane = "compose";
            S.ack = false;
            render(true);
            break;
          case "start":
            startRun();
            break;
          case "tab":
            S.tab = el.dataset.t;
            render();
            $("#tab-" + S.tab)?.focus();
            break;
          case "cancel-ask":
            S.cancelAsk = true;
            render();
            break;
          case "cancel-no":
            S.cancelAsk = false;
            render();
            break;
          case "cancel-yes": {
            const r = runById(id);
            stopTimer();
            r.status = "cancelled";
            S.cancelAsk = false;
            Object.values(r.steps).forEach((s) => {
              if (["running", "waiting", "pending"].includes(s.state)) s.state = "skipped";
            });
            live(tt("stCancelled"));
            render();
            break;
          }
          case "open-conv":
          case "open-conv-view":
            S.conv = { runId: id };
            S.convChoice = 0;
            S.convDone = null;
            S.view = "tasks";
            render();
            $(".conv .o[aria-checked=true]")?.focus();
            break;
          case "conv-opt":
            S.convChoice = +el.dataset.i;
            render();
            $$('[role="radio"]')[S.convChoice].focus();
            break;
          case "conv-confirm": {
            const r = runById(S.conv.runId);
            if (S.convChoice === 0) {
              S.convDone = "allow";
              grant(r);
            } else if (S.convChoice === 1) {
              S.convDone = "deny";
              denyRun(r);
            } else break; // 未实现的选项不得被当作另一种动作执行
            render();
            $("#conv-return")?.focus();
            live(tt(S.convDone === "allow" ? "allowedNote" : "deniedNote"));
            break;
          }
          case "conv-back": {
            const rid = S.conv?.runId;
            S.conv = null;
            S.pane = "run";
            S.selected = rid;
            S.mobile = "detail";
            render(true);
            break;
          }
          case "approve":
          case "reject": {
            const r = runById(S.selected);
            r.status = a === "approve" ? "approved" : "rejected";
            r.steps.approval = { state: "done" };
            S.comment = "";
            live(tt(a === "approve" ? "stApproved" : "stRejected"));
            render();
            break;
          }
          case "again": {
            const r = runById(id);
            S.draft = {
              request: r.request,
              wf: r.wf,
              context: (r.context || []).map((c) => ({ ...c })),
              build: r.draft?.build ?? "build",
              test: r.draft?.test ?? "test",
            };
            S.prefilledFrom = r.request;
            S.pane = "compose";
            S.selected = null;
            S.mobile = "detail";
            S.ack = false;
            render(true);
            break;
          }
          case "check-sel":
            // 切换检查时保留其他检查未保存的编辑。
            S.checkNote = false;
            S.checkSel = id;
            S.mobile = "detail";
            render();
            break;
          case "check-save":
            S.checksSaved = S.checksSaved.map((c) =>
              c.id === S.checkSel
                ? JSON.parse(JSON.stringify(S.checks.find((x) => x.id === c.id)))
                : c,
            );
            S.checkNote = true;
            render();
            live(tt("savedOk"));
            break;
          case "check-revert":
            S.checks = S.checks.map((c) =>
              c.id === S.checkSel
                ? JSON.parse(JSON.stringify(S.checksSaved.find((x) => x.id === c.id)))
                : c,
            );
            render();
            break;
        }
      }
      function defaultTab(r) {
        return ["stopped-test"].includes(r.status)
          ? "checks"
          : ["stopped-review"].includes(r.status)
            ? "evidence"
            : r.status === "needs-approval"
              ? "changes"
              : "steps";
      }
      function goReview() {
        if (!S.draft.request.trim()) return;
        S.pane = "review";
        S.ack = false;
        render(true);
        $("#detail")?.scrollTo(0, 0);
      }

      /* ============================ simulation ============================ */
      function newRun() {
        const d = JSON.parse(JSON.stringify(S.draft));
        const ids = stepsFor(d.wf);
        const steps = {};
        ids.forEach((i) => (steps[i] = { state: "pending" }));
        const r = {
          id: "r-" + S.nextId++,
          request: d.request.trim(),
          wf: d.wf,
          mins: 0,
          status: "running",
          steps,
          scenario: S.scenario,
          context: d.context,
          draft: d,
          checks: JSON.parse(JSON.stringify(S.checksSaved)),
          sim: true,
          granted: {},
        };
        S.runs.unshift(r);
        return r;
      }
      function startRun() {
        const r = newRun();
        S.pane = "run";
        S.selected = r.id;
        S.tab = "steps";
        S.mobile = "detail";
        S.ack = false;
        render(true);
        live(tt("stRunning", stepName("analyze")));
        tick(r);
      }
      const wait = (ms) => ms * S.speed;
      function stopTimer() {
        clearTimeout(S.timer);
        S.timer = null;
      }
      function tick(r) {
        stopTimer();
        const ids = stepsFor(r.wf);
        const id = ids.find(
          (x) => r.steps[x].state === "pending" || r.steps[x].state === "running",
        );
        if (!id) return;
        if (id === "approval") {
          r.steps.approval.state = "waiting";
          r.status = "needs-approval";
          live(tt("waitTitle"));
          render();
          return;
        }
        r.steps[id].state = "running";
        r.status = "running";
        render();
        const needsPerm = ["implement", "build", "test"].includes(id) && !r.granted[id];
        S.timer = setTimeout(
          () => {
            if (needsPerm) {
              r.steps[id].state = "waiting";
              r.status = "needs-permission";
              live(tt("permAlertTitle", stepName(id)));
              render();
              return;
            }
            if (id === "test" && r.scenario === "test") {
              r.steps.test.state = "failed";
              r.status = "stopped-test";
              ["review", "approval"].forEach((k) => r.steps[k] && (r.steps[k].state = "skipped"));
              S.tab = "checks";
              live(tt("failTestTitle"));
              render();
              return;
            }
            if (id === "review" && r.scenario === "reviewer") {
              r.steps.review.state = "failed";
              r.status = "stopped-review";
              r.steps.approval && (r.steps.approval.state = "skipped");
              S.tab = "evidence";
              live(tt("failReviewTitle"));
              render();
              return;
            }
            r.steps[id].state = "done";
            tick(r);
          },
          wait(id === "analyze" ? 1400 : id === "review" ? 1600 : 1000),
        );
      }
      function grant(r) {
        const id = currentStep(r);
        r.granted[id] = true;
        r.steps[id].state = "pending";
        r.status = "running";
        tick(r);
      }
      function denyRun(r) {
        stopTimer();
        const id = currentStep(r);
        r.steps[id].state = "failed";
        r.status = "cancelled";
        Object.values(r.steps).forEach((s) => {
          if (["pending", "running", "waiting"].includes(s.state)) s.state = "skipped";
        });
      }

      /* ============================ jumps & panel ============================ */
      function jump(k, opts = {}) {
        stopTimer();
        S.conv = null;
        S.view = "tasks";
        S.cancelAsk = false;
        if (k === "compose") {
          S.pane = "compose";
          S.selected = null;
          S.mobile = "detail";
          if (!S.draft.request.trim()) S.draft.request = "Modify zz-demo.txt file content to after";
          render(true);
          return;
        }
        if (k === "review") {
          if (!S.draft.request.trim()) S.draft.request = "Modify zz-demo.txt file content to after";
          S.pane = "review";
          S.ack = false;
          S.mobile = "detail";
          render(true);
          return;
        }
        const base = {
          request: "Modify zz-demo.txt file content to after",
          wf: "seq",
          mins: 0,
          context: [{ id: "ctx", name: "Context.md", kind: "instr" }],
          draft: {
            request: "Modify zz-demo.txt file content to after",
            wf: "seq",
            context: [],
            build: "build",
            test: "test",
          },
          checks: JSON.parse(JSON.stringify(S.checksSaved)),
          sim: true,
          granted: {},
          ...opts,
        };
        const mk = (status, steps, scenario) => {
          const r = {
            ...base,
            id: "r-" + S.nextId++,
            status,
            steps: {
              ...Object.fromEntries(STEP_IDS.map((i) => [i, { state: "pending" }])),
              ...steps,
            },
            scenario,
          };
          S.runs.unshift(r);
          S.pane = "run";
          S.selected = r.id;
          S.mobile = "detail";
          return r;
        };
        if (k === "perm") {
          const r = mk(
            "needs-permission",
            {
              analyze: { state: "done" },
              implement: { state: "done" },
              build: { state: "waiting" },
            },
            S.scenario,
          );
          r.granted = { implement: true };
          S.tab = "steps";
        }
        if (k === "approval") {
          mk(
            "needs-approval",
            {
              analyze: { state: "done" },
              implement: { state: "done" },
              build: { state: "done" },
              test: { state: "done" },
              review: { state: "done" },
              approval: { state: "waiting" },
            },
            "pass",
          );
          S.tab = "changes";
        }
        if (k === "fail-reviewer") {
          mk(
            "stopped-review",
            {
              analyze: { state: "done" },
              implement: { state: "done" },
              build: { state: "done" },
              test: { state: "done" },
              review: { state: "failed" },
              approval: { state: "skipped" },
            },
            "reviewer",
          );
          S.tab = "evidence";
        }
        if (k === "fail-test") {
          mk(
            "stopped-test",
            {
              analyze: { state: "done" },
              implement: { state: "done" },
              build: { state: "done" },
              test: { state: "failed" },
              review: { state: "skipped" },
              approval: { state: "skipped" },
            },
            "test",
          );
          S.tab = "checks";
        }
        render(true);
      }
      function seg(id, items, cur, on) {
        $(id).innerHTML = items
          .map(
            ([v, l]) =>
              `<button class="btn sm" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`,
          )
          .join("");
        $$("button", $(id)).forEach((b) => b.addEventListener("click", () => on(b.dataset.v)));
      }
      function renderPanel() {
        applyStatic();
        seg(
          "#pc-scenario",
          [
            ["pass", tt("scPass")],
            ["reviewer", tt("scReviewer")],
            ["test", tt("scTest")],
          ],
          S.scenario,
          (v) => {
            S.scenario = v;
            renderPanel();
          },
        );
        seg(
          "#pc-jump",
          [
            ["compose", tt("jCompose")],
            ["review", tt("jReview")],
            ["perm", tt("jPerm")],
            ["approval", tt("jApproval")],
            ["fail-reviewer", tt("jFailReviewer")],
            ["fail-test", tt("jFailTest")],
          ],
          "",
          (v) => {
            jump(v);
          },
        );
        seg(
          "#pc-theme",
          [
            ["dark", tt("dark")],
            ["light", tt("light")],
          ],
          S.theme,
          (v) => {
            S.theme = v;
            document.documentElement.dataset.theme = v;
            renderPanel();
          },
        );
        seg(
          "#pc-lang",
          [
            ["en", "EN"],
            ["zh", "中文"],
          ],
          S.lang,
          (v) => {
            S.lang = v;
            render();
            renderPanel();
          },
        );
        seg(
          "#pc-speed",
          [
            ["1", tt("normal")],
            ["0.2", tt("fast")],
          ],
          String(S.speed),
          (v) => {
            S.speed = +v;
            renderPanel();
          },
        );
      }
      function setProto(on) {
        S.protoOpen = on;
        $("#proto-panel").classList.toggle("on", on);
        $("#proto-toggle").setAttribute("aria-expanded", on);
        if (on) renderPanel();
      }
      $("#proto-toggle").addEventListener("click", () => setProto(!S.protoOpen));
      $("#pc-close").addEventListener("click", () => {
        setProto(false);
        $("#proto-toggle").focus();
      });
      $("#pc-reset").addEventListener("click", () => {
        stopTimer();
        const keep = { lang: S.lang, theme: S.theme, speed: S.speed, scenario: S.scenario };
        Object.assign(
          S,
          {
            view: "tasks",
            pane: "compose",
            selected: null,
            conv: null,
            runs: SEED_RUNS(),
            checks: JSON.parse(JSON.stringify(CHECKS0)),
            checksSaved: JSON.parse(JSON.stringify(CHECKS0)),
            draft: {
              request: "",
              wf: "seq",
              context: [{ id: "ctx", name: "Context.md", kind: "instr", path: "Context.md" }],
              build: "build",
              test: "test",
            },
            prefilledFrom: null,
            ack: false,
            comment: "",
            nextId: 200,
          },
          keep,
        );
        render(true);
      });
      $("#back-chat").addEventListener("click", () =>
        toast(S.lang === "zh" ? "原型：不会离开此页面" : "Prototype: does not leave this page"),
      );
      window.__proto = { jump, act, S, setProto, start: startRun };
      renderChrome();
      renderMain();
      renderPanel();
    </script>
  </body>
</html>
