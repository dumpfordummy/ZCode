name: ZCode Graph Windows prerelease

on:
  push:
    tags:
      - "graph-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Z1 prerelease version (e.g. 3.14.0-z1.1); manual runs build artifacts only"
        required: true
        default: "3.14.0-z1.1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HUSKY: "0"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare Electron
        run: node node_modules/electron/install.js
      - name: Verify source
        run: |
          node --test scripts/graph-engineering/distribution.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/tsx/dist/cli.mjs --test packages/services/src/graph-engineering/app/service.test.ts packages/services/src/graph-engineering/adapters/repository.test.ts packages/services/src/graph-engineering/adapters/native.test.ts packages/services/src/graph-engineering/adapters/observer.test.ts packages/services/src/zcode-agent/expectedRuntimeClient.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx --test packages/services/test/*.test.ts apps/zcode-cli/packages/bootstrap/src/zcode-protocol-v4/interaction-registry.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TSX_TSCONFIG_PATH = 'packages/ui/tsconfig.json'
          node --import tsx --test packages/ui/test/*.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Env:TSX_TSCONFIG_PATH
          pnpm typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm architecture:check --changed
      - name: Build Windows x64 installer
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $releaseVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^graph-v', '' } else { $env:MANUAL_VERSION }
          node scripts/graph-engineering/build-windows.mjs $releaseVersion
      - name: Test detached packaged application with local provider
        run: node scripts/graph-engineering/packaged-smoke.mjs
      - name: Preserve installer and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcode-graph-windows-x64
          path: |
            packages/desktop/dist-graph/*.exe
            packages/desktop/dist-graph/SHA256SUMS.txt
            packages/desktop/dist-graph/packaged-smoke.json
            packages/desktop/dist-graph/smoke-evidence/
      - name: Publish verified prerelease
        if: startsWith(github.ref, 'refs/tags/graph-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem packages/desktop/dist-graph/*.exe).FullName
          gh release create $env:GITHUB_REF_NAME $installer packages/desktop/dist-graph/SHA256SUMS.txt --verify-tag --prerelease --title "ZCode Graph $env:GITHUB_REF_NAME (Windows x64)" --notes-file docs/graph-engineering/WINDOWS_RELEASE_NOTES.md
